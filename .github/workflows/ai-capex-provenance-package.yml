name: Build AI capex provenance package

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

jobs:
  build-package:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Download complete official sources
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p resources
          get() {
            echo "::group::Downloading $1"
            curl --fail --location --show-error \
              --retry 5 --retry-all-errors --retry-delay 3 \
              --connect-timeout 30 --max-time 900 \
              --user-agent 'Mozilla/5.0 provenance-builder/1.0' \
              --output "$2" "$1"
            test -s "$2"
            stat --printf='%n: %s bytes\n' "$2"
            file "$2"
            echo '::endgroup::'
          }
          get 'https://iea.blob.core.windows.net/assets/3179f7f8-01f6-4dd6-bffa-c9f7b73f1dc9/KeyQuestionsonEnergyandAI.pdf' 'resources/IEA_2026_Key_Questions_on_Energy_and_AI.pdf'
          get 'https://iea.blob.core.windows.net/assets/de9dea13-b07d-42c5-a398-d1b3ae17d866/EnergyandAI.pdf' 'resources/IEA_2025_Energy_and_AI.pdf'

          echo '::group::Resolving and downloading LBNL 2026 through the official eScholarship browser interface'
          python -m pip install --quiet selenium requests
          python <<'PY'
          from __future__ import annotations
          import json
          import shutil
          import time
          from pathlib import Path
          import requests
          from selenium import webdriver
          from selenium.webdriver.chrome.options import Options
          from selenium.webdriver.chrome.service import Service

          landing = 'https://escholarship.org/uc/item/33m6w3x0'
          graphql = 'https://escholarship.org/graphql'
          out = Path('resources/LBNL_2026_United_States_Data_Center_Energy_Usage_Report_2025_Update.pdf').resolve()
          download_dir = Path('lbnl_browser_download').resolve()
          if download_dir.exists():
              shutil.rmtree(download_dir)
          download_dir.mkdir(parents=True)

          api = requests.post(
              graphql,
              headers={'Content-Type': 'application/json'},
              data=json.dumps({'query': '{ item(id: "ark:/13030/qt33m6w3x0") { contentLink } }'}),
              timeout=60,
          )
          api.raise_for_status()
          content_url = api.json()['data']['item']['contentLink']
          print('Official contentLink:', content_url)

          chrome = shutil.which('google-chrome') or shutil.which('chromium') or shutil.which('chromium-browser')
          if not chrome:
              raise RuntimeError('Chrome/Chromium is not available')
          options = Options()
          options.binary_location = chrome
          options.add_argument('--headless=new')
          options.add_argument('--no-sandbox')
          options.add_argument('--disable-gpu')
          options.add_argument('--disable-dev-shm-usage')
          options.add_argument('--window-size=1440,1200')
          options.add_experimental_option('prefs', {
              'download.default_directory': str(download_dir),
              'download.prompt_for_download': False,
              'download.directory_upgrade': True,
              'plugins.always_open_pdf_externally': True,
              'safebrowsing.enabled': True,
          })
          driver_path = shutil.which('chromedriver')
          service = Service(driver_path) if driver_path else Service()
          driver = webdriver.Chrome(service=service, options=options)
          try:
              driver.get(landing)
              time.sleep(12)
              print('Landing title:', driver.title)
              print('Landing URL:', driver.current_url)

              driver.get(content_url)
              deadline = time.time() + 90
              candidates = []
              while time.time() < deadline:
                  partials = list(download_dir.glob('*.crdownload'))
                  candidates = [p for p in download_dir.iterdir() if p.is_file() and not p.name.endswith('.crdownload')]
                  if candidates and not partials:
                      break
                  time.sleep(2)

              if candidates:
                  downloaded = max(candidates, key=lambda p: p.stat().st_mtime)
                  shutil.copyfile(downloaded, out)
                  print('Browser-downloaded file:', downloaded.name, downloaded.stat().st_size)
              else:
                  session = requests.Session()
                  ua = driver.execute_script('return navigator.userAgent')
                  for cookie in driver.get_cookies():
                      session.cookies.set(cookie['name'], cookie['value'], domain=cookie.get('domain'), path=cookie.get('path', '/'))
                  response = session.get(
                      content_url,
                      headers={'User-Agent': ua, 'Referer': landing, 'Accept': 'application/pdf,*/*'},
                      timeout=180,
                      allow_redirects=True,
                  )
                  print('Cookie-session response:', response.status_code, response.headers.get('content-type'), len(response.content))
                  response.raise_for_status()
                  out.write_bytes(response.content)
          finally:
              driver.quit()

          data = out.read_bytes()
          if not data.startswith(b'%PDF-'):
              raise RuntimeError(f'eScholarship download is not a PDF; size={len(data)}')
          print('Verified LBNL PDF header and size:', len(data))
          PY
          echo '::endgroup::'

          get 'https://eta-publications.lbl.gov/sites/default/files/2024-12/lbnl-2024-united-states-data-center-energy-usage-report_1.pdf' 'resources/LBNL_2024_United_States_Data_Center_Energy_Usage_Report.pdf'
          get 'https://www.federalreserve.gov/monetarypolicy/files/20260710_mprfullreport.pdf' 'resources/Federal_Reserve_2026_Monetary_Policy_Report_July.pdf'
          get 'https://www.federalreserve.gov/econres/notes/feds-notes/the-global-trade-effects-of-the-ai-infrastructure-boom-20260213.html' 'resources/Federal_Reserve_2026_The_Global_Trade_Effects_of_the_AI_Infrastructure_Boom.html'

      - name: Render Federal Reserve HTML note to PDF
        shell: bash
        run: |
          set -euo pipefail
          CHROME="$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          test -n "$CHROME"
          "$CHROME" --headless --no-sandbox --disable-gpu \
            --virtual-time-budget=15000 \
            --print-to-pdf='resources/Federal_Reserve_2026_The_Global_Trade_Effects_of_the_AI_Infrastructure_Boom.pdf' \
            'https://www.federalreserve.gov/econres/notes/feds-notes/the-global-trade-effects-of-the-ai-infrastructure-boom-20260213.html'
          test -s 'resources/Federal_Reserve_2026_The_Global_Trade_Effects_of_the_AI_Infrastructure_Boom.pdf'

      - name: Verify files and archive
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --quiet pypdf
          python <<'PY'
          from pathlib import Path
          import hashlib
          from pypdf import PdfReader

          expected = {
              'IEA_2026_Key_Questions_on_Energy_and_AI.pdf': (130, 150),
              'IEA_2025_Energy_and_AI.pdf': (290, 320),
              'LBNL_2026_United_States_Data_Center_Energy_Usage_Report_2025_Update.pdf': (20, 100),
              'LBNL_2024_United_States_Data_Center_Energy_Usage_Report.pdf': (70, 90),
              'Federal_Reserve_2026_Monetary_Policy_Report_July.pdf': (70, 85),
              'Federal_Reserve_2026_The_Global_Trade_Effects_of_the_AI_Infrastructure_Boom.pdf': (3, 20),
          }
          hashes = {}
          for name, bounds in expected.items():
              p = Path('resources') / name
              if not p.is_file():
                  raise SystemExit(f'Missing required PDF: {p}')
              data = p.read_bytes()
              if not data.startswith(b'%PDF-'):
                  raise SystemExit(f'Invalid PDF header: {p}')
              pages = len(PdfReader(str(p), strict=False).pages)
              if not bounds[0] <= pages <= bounds[1]:
                  raise SystemExit(f'Unexpected page count for {p}: {pages}, expected {bounds}')
              digest = hashlib.sha256(data).hexdigest()
              if digest in hashes:
                  raise SystemExit(f'Duplicate PDF content: {p} and {hashes[digest]}')
              hashes[digest] = p
              print(f'{p.name}: {pages} pages, {p.stat().st_size} bytes, sha256={digest}')

          html = Path('resources/Federal_Reserve_2026_The_Global_Trade_Effects_of_the_AI_Infrastructure_Boom.html')
          text = html.read_text(encoding='utf-8', errors='replace')
          if 'The Global Trade Effects of the AI Infrastructure Boom' not in text:
              raise SystemExit('Federal Reserve HTML title verification failed')
          PY
          zip -r -9 AI_Capex_Official_Source_Files.zip resources

      - name: Upload source bundle
        uses: actions/upload-artifact@v4
        with:
          name: AI-Capex-Official-Source-Files
          path: AI_Capex_Official_Source_Files.zip
          if-no-files-found: error
          retention-days: 7
