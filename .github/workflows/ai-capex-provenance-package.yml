name: Build AI capex provenance package

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

jobs:
  build-package:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out pull request
        uses: actions/checkout@v4

      - name: Run provenance builder
        shell: bash
        run: bash scripts/ai_capex_provenance.sh

      - name: Upload provenance package
        if: ${{ hashFiles('AI_Capex_Macro_Provenance_Package_2026-08-08.zip') != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: AI-Capex-Macro-Provenance-Package-2026-08-08
          path: AI_Capex_Macro_Provenance_Package_2026-08-08.zip
          if-no-files-found: error
          retention-days: 7
