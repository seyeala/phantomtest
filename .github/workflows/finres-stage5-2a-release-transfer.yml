name: Cleanup temporary Fin_res Stage5 2A transfer

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/finres-stage5-2a-release-transfer.yml
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Delete temporary artifact and release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh api --method DELETE repos/${{ github.repository }}/actions/artifacts/9671576731 || true
          gh release delete 'finres-stage5-2a-20260828' --repo '${{ github.repository }}' --yes --cleanup-tag || true
