name: Temporary SEC exhibit transfer

on:
  push:
    branches:
      - temporary-sec-cache-transfer-20260822
    paths:
      - .github/workflows/temporary-sec-cache-transfer.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  transfer:
    runs-on: ubuntu-latest
    steps:
      - name: Download additional official SEC exhibits
        shell: bash
        run: |
          set -euo pipefail
          root='incremental/www.sec.gov/Archives/edgar/data/1045810/000104581026000052'
          mkdir -p "$root"
          for name in \
            nvda2027q1ex311.htm \
            nvda2027q1ex312.htm \
            nvda2027q1ex321.htm \
            nvda2027q1ex322.htm
          do
            curl --fail --silent --show-error --location \
              --retry 4 --retry-all-errors \
              --user-agent 'OpenAI primary-source research operations support@openai.com' \
              "https://www.sec.gov/Archives/edgar/data/1045810/000104581026000052/${name}" \
              --output "$root/$name"
            test "$(wc -c < "$root/$name")" -gt 20
            grep -Eiq '<!doctype html|<html|<head|<body' "$root/$name"
            grep -Eiq 'nvidia|nvda' "$root/$name"
            sleep 0.2
          done
          find incremental -type f -print0 | sort -z | xargs -0 sha256sum > incremental/SEC_INCREMENTAL_SHA256SUMS.txt
      - name: Upload additional official SEC exhibits
        uses: actions/upload-artifact@v4
        with:
          name: NVDA_SEC_incremental_exhibits_20260821
          path: incremental
          if-no-files-found: error
          retention-days: 1
          compression-level: 0
