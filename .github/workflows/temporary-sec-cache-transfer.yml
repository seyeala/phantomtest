name: Temporary SEC cache transfer

on:
  push:
    branches:
      - temporary-sec-cache-transfer-20260822
    paths:
      - .github/workflows/temporary-sec-cache-transfer.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  transfer:
    runs-on: ubuntu-latest
    steps:
      - name: Download verified public SEC cache
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location \
            --retry 4 --retry-all-errors \
            'https://temp.sh/WIxVj/NVDA_SEC_official_cache_20260821.zip' \
            --output NVDA_SEC_official_cache_20260821.zip
          printf '%s  %s\n' \
            '897a87ab847d9c0b333d75b8cd695c33296fed67214b428ae673607201c04706' \
            'NVDA_SEC_official_cache_20260821.zip' | sha256sum --check --strict
      - name: Upload verified cache
        uses: actions/upload-artifact@v4
        with:
          name: NVDA_SEC_official_cache_20260821
          path: NVDA_SEC_official_cache_20260821.zip
          if-no-files-found: error
          retention-days: 1
          compression-level: 0
